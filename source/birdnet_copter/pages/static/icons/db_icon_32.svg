<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 36" width="40" height="36">
  <!-- Bottom cylinder body -->
  <rect x="4" y="18" width="32" height="10" fill="#5b8fc9"/>
  <!-- Bottom face -->
  <ellipse cx="20" cy="28" rx="16" ry="5" fill="#4a7db5" stroke="#2a5f9e" stroke-width="1.2"/>
  <!-- Middle disk -->
  <ellipse cx="20" cy="18" rx="16" ry="5" fill="#7aaad8" stroke="#2a5f9e" stroke-width="1.2"/>
  <!-- Top cylinder body -->
  <rect x="4" y="8" width="32" height="10" fill="#9ec2e8"/>
  <!-- Top disk -->
  <ellipse cx="20" cy="8" rx="16" ry="5" fill="#b8d4ee" stroke="#5b8fc9" stroke-width="1.2"/>
  <!-- Side lines -->
  <line x1="4" y1="8" x2="4" y2="28" stroke="#2a5f9e" stroke-width="1.2"/>
  <line x1="36" y1="8" x2="36" y2="28" stroke="#2a5f9e" stroke-width="1.2"/>
</svg>
